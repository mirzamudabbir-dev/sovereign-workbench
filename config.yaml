# Single source of runtime configuration.
# Must match the `Settings` model in docs/01_CONTRACTS.md field-for-field.
# All paths are resolved to absolute at load time by core/config.py.

paths:
  data:        ./data
  uploads:     ./data/uploads
  page_images: ./data/page_images
  workspaces:  ./data/workspaces
  outputs:     ./data/outputs
  receipts:    ./data/receipts
  manifests:   ./manifests
  templates:   ./templates

sandbox:
  image:       sovereign-sandbox:latest
  runtime:     runc           # Documented fallback (see core/sandbox.py's own comment) — this
                              # session's colima VM is a fresh instance without gVisor registered
                              # (Session 6/7 noted the same gap; Session 4's runsc install did not
                              # persist across colima VM recreations on this dev machine). runc
                              # still gives network_mode="none" + the other isolation flags; only
                              # the extra kernel-syscall-interception layer is missing. The venue
                              # Ubuntu box gets its own real gVisor install via
                              # scripts/00_install_gvisor.sh — set this back to `runsc` there.
  timeout_s:   60
  mem_limit:   2g
  pids_limit:  64

agent:
  max_iterations:        3     # hard cap on the verify -> re-plan loop
  ocr_review_threshold:  0.75  # below this, EvidenceSpan.needs_review = True

qdrant_url:           http://127.0.0.1:6333
embedding_model_path: ./models/embeddinggemma-300m   # LOCAL PATH ONLY. Never a HuggingFace id
                                             # at runtime — that is a network call (breaks R1).
router_model_id:      gemma4-e2b
ocr_model_id:         gemma4-e2b-ocr

# --- Local dev profile (8 GB M1 MacBook Air, Ollama) — see docs/PATCH_02_LOCAL_MODELS.md ---
serving_backend:        ollama
structured_output_mode: response_format  # set from scripts/probe_structured.py — see PROGRESS.md

audit:
  egress_source: pktap   # macOS dev; "tetragon" on the Linux demo box. Reverted after
                          # Session 9's live verification (colima + a real Tetragon
                          # container, genuinely observed AND enforced for real — see
                          # PROGRESS.md). Left as "tetragon" only long enough to prove
                          # the whole receipt pipeline end to end; back to "pktap" as
                          # the honest default, since this Tetragon instance can only
                          # see traffic that originates INSIDE colima's own Docker
                          # (confirmed empirically: a native macOS curl produces zero
                          # events, a container curl does) — every real task's LLM/KB
                          # traffic runs natively on macOS on this dev machine, so
                          # leaving "tetragon" as the default would make every future
                          # receipt look emptier than reality, not more correct.
